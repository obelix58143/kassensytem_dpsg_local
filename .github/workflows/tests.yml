name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # 3.11 = Raspberry Pi OS (Bookworm)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pytest websocket-client
      - name: pytest
        run: python -m pytest tests -v

  frontend:
    name: Oberfläche bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci & build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: Browser-Tests (${{ matrix.modus }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modus: [normal, alt-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Abhängigkeiten
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Ende-zu-Ende-Test
        run: |
          mkdir -p e2e-screenshots
          python tests/e2e.py ${{ matrix.modus == 'alt-browser' && '--sim-alt' || '' }} --shots e2e-screenshots
      - name: Screenshots bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.modus }}
          path: e2e-screenshots
